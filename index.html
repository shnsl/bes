<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101835" />
    <script>
      (function () {
        var saved = localStorage.getItem("bes-theme");
        var theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#101835" : "#eef2f8");
      })();
    </script>
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ÖTE" />
    <title>ÖTE</title>
    <script>
      (function () {
        function go() {
          if (document.fullscreenElement) return;
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (!req) return;
          try {
            var p = req.call(el, { navigationUI: "hide" });
            if (p && p.catch) p.catch(function () {});
          } catch (e) {}
        }
        go();
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") go();
        });
        window.addEventListener("pageshow", go);
        window.addEventListener("pointerdown", go, { capture: true });
        window.addEventListener("touchstart", go, { capture: true, passive: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
